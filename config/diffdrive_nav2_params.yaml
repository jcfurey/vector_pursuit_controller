# Vector Pursuit Controller — tuning for a zero-turn differential-drive base.
#
# Differences from config/sample_nav2_params.yaml (which is tuned for the
# BCR-bot demo) that matter for a zero-turn diff-drive platform:
#
#   min_turning_radius: 0.0   -> the base can spin in place; this also makes
#                                the controller auto-enable use_rotate_to_heading
#                                so sharp corrections rotate rather than arc.
#   allow_reversing:   false  -> with rotate-to-heading on, reversing would be
#                                overridden anyway; keep it off to avoid the warning.
#   max_angular_accel        -> a real, tuned limit matters here: the diff-drive
#                                base faithfully executes the commanded angular
#                                velocity, which the controller now acceleration-
#                                limits on the curvature path as well. Set it to
#                                your chassis's achievable angular acceleration.
#
# Tune desired_linear_vel, the lookahead distances, accelerations, and the
# costmap footprint to your robot. Values below are a sane diff-drive starting
# point, not a turn-key configuration.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "vector_pursuit_controller::VectorPursuitController"
      k: 6.0
      desired_linear_vel: 0.5
      # Zero-turn base: in-place rotation allowed. min_turning_radius == 0.0
      # auto-enables use_rotate_to_heading.
      min_turning_radius: 0.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      # On-point rotation for headings beyond ~37 deg; arc-track within it.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.65
      rotate_to_heading_angular_vel: 1.0
      # Angular acceleration cap — now enforced on BOTH the rotate-to-heading
      # and the curvature-tracking paths. Set to your chassis limit.
      max_angular_accel: 2.5
      max_linear_accel: 1.5
      # Lateral-accel limit still slows the robot through tight arcs.
      max_lateral_accel: 0.5
      transform_tolerance: 0.1
      # Reversing is overridden by rotate-to-heading; leave off.
      allow_reversing: false
      min_linear_velocity: 0.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_target: 1.0
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_interpolation: true
      # Diff drive can hold arbitrary heading; compute it from geometry unless
      # your planner emits meaningful per-pose orientations (e.g. Smac).
      use_heading_from_path: false
